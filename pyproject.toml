[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-research-lab"
version = "0.1.0"
description = "Leakage-aware ARC-AGI-2 research harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gemma = ["google-genai"]

[project.scripts]
arc-lab = "arc_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
