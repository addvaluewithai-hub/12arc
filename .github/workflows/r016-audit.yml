name: r016-audit
on:
  push:
    paths: ['lab/triggers/r016-audit.request']
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Audit latest NVIDIA baseline workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p lab/recon
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def gh(*args):
              out = subprocess.check_output(['gh','api',*args], text=True)
              return json.loads(out)

          repo=os.environ['GH_REPO']
          runs=gh(f'/repos/{repo}/actions/workflows/nvidia-baseline.yml/runs?per_page=10')
          candidates=[r for r in runs.get('workflow_runs',[]) if r.get('event')=='push']
          if not candidates:
              raise SystemExit('no nvidia-baseline workflow runs found')
          run=candidates[0]
          jobs=gh(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
          record={
              'schema_version':1,
              'run_id':run['id'],
              'head_sha':run.get('head_sha'),
              'status':run.get('status'),
              'conclusion':run.get('conclusion'),
              'created_at':run.get('created_at'),
              'updated_at':run.get('updated_at'),
              'html_url':run.get('html_url'),
              'jobs':[
                  {
                      'id':j.get('id'),
                      'name':j.get('name'),
                      'status':j.get('status'),
                      'conclusion':j.get('conclusion'),
                      'started_at':j.get('started_at'),
                      'completed_at':j.get('completed_at'),
                      'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for s in j.get('steps',[])],
                  }
                  for j in jobs.get('jobs',[])
              ],
          }
          Path('lab/recon/ARC-R016-workflow-audit.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lab/recon/ARC-R016-workflow-audit.json
          git commit -m 'ARC-R016: record workflow audit'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
