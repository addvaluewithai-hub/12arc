name: nvidia-model-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'lab/triggers/nvidia-model-smoke.request'

permissions:
  contents: write

concurrency:
  group: nvidia-model-smoke
  cancel-in-progress: true

env:
  NVIDIA_ENDPOINT: https://integrate.api.nvidia.com/v1/chat/completions

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify NVIDIA secret exists
        run: test -n "$NVIDIA_API_KEY"

      - name: Configure evidence commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Probe DeepSeek family and controls
        shell: bash
        run: |
          mkdir -p artifacts lab/recon
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          endpoint = os.environ["NVIDIA_ENDPOINT"]
          api_key = os.environ["NVIDIA_API_KEY"]
          models = [
              "deepseek-ai/deepseek-v4-flash-0731",
              "deepseek-ai/deepseek-v4-flash",
              "deepseek-ai/deepseek-v4-pro",
              "nvidia/nemotron-3-ultra-550b-a55b",
          ]

          def persist(report, label):
              text = json.dumps(report, indent=2, sort_keys=True) + "\n"
              Path("artifacts/nvidia-model-smoke.json").write_text(text)
              Path("lab/recon/nvidia-model-smoke-latest.json").write_text(text)
              subprocess.run(["git", "add", "lab/recon/nvidia-model-smoke-latest.json"], check=True)
              committed = subprocess.run(["git", "commit", "-m", f"Record NVIDIA smoke: {label}"], check=False).returncode == 0
              if committed:
                  subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
                  subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

          report = {
              "schema_version": 3,
              "purpose": "NVIDIA hosted-model availability smoke test; non-ARC; find a callable DeepSeek-family model or prove only control models work",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "endpoint": endpoint,
              "secret_persisted": False,
              "models": [],
              "complete": False,
          }
          persist(report, "probe initialized")

          for model in models:
              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                  "max_tokens": 32,
                  "temperature": 0,
                  "stream": False,
              }
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              started = time.perf_counter()
              status = None
              body = ""
              transport_error = None
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = response.status
                      body = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode("utf-8", errors="replace")
                  transport_error = f"HTTP {exc.code}"
              except Exception as exc:
                  transport_error = f"{type(exc).__name__}: {exc}"
              latency = time.perf_counter() - started

              data = None
              try:
                  data = json.loads(body) if body else None
              except json.JSONDecodeError:
                  pass

              content = ""
              reasoning = ""
              finish_reason = None
              response_model = None
              usage = None
              api_error = None
              provider_message = None
              if isinstance(data, dict):
                  response_model = data.get("model")
                  usage = data.get("usage")
                  provider_message = data.get("message") or data.get("detail")
                  choices = data.get("choices") or []
                  if choices:
                      first = choices[0] or {}
                      finish_reason = first.get("finish_reason")
                      message = first.get("message") or {}
                      content = message.get("content") or ""
                      reasoning = message.get("reasoning_content") or message.get("reasoning") or ""
                  if data.get("error"):
                      err = data["error"]
                      api_error = err if isinstance(err, dict) else {"message": str(err)[:1000]}

              report["models"].append({
                  "model_requested": model,
                  "http_status": status,
                  "request_succeeded": status == 200,
                  "response_model": response_model,
                  "content_chars": len(content) if isinstance(content, str) else 0,
                  "content_preview": content[:120] if isinstance(content, str) else "",
                  "reasoning_chars": len(reasoning) if isinstance(reasoning, str) else 0,
                  "finish_reason": finish_reason,
                  "usage": usage,
                  "latency_seconds": round(latency, 3),
                  "transport_error": transport_error,
                  "api_error": api_error,
                  "provider_message_preview": str(provider_message)[:1000] if provider_message is not None else None,
                  "raw_body_preview": body[:1000] if status != 200 else None,
              })
              persist(report, model.replace("/", "-"))

          successes = [item["model_requested"] for item in report["models"] if item["request_succeeded"]]
          report["complete"] = True
          report["successes"] = successes
          report["deepseek_versioned_available"] = any(item["model_requested"] == "deepseek-ai/deepseek-v4-flash-0731" and item["request_succeeded"] for item in report["models"])
          report["deepseek_alias_available"] = any(item["model_requested"] == "deepseek-ai/deepseek-v4-flash" and item["request_succeeded"] for item in report["models"])
          report["deepseek_pro_available"] = any(item["model_requested"] == "deepseek-ai/deepseek-v4-pro" and item["request_succeeded"] for item in report["models"])
          persist(report, "probe complete")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-model-smoke
          path: artifacts/nvidia-model-smoke.json
          if-no-files-found: warn
