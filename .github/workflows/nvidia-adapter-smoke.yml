name: nvidia-adapter-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'lab/triggers/nvidia-adapter-smoke.request'

permissions:
  contents: write

concurrency:
  group: nvidia-adapter-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify NVIDIA secret exists
        run: test -n "$NVIDIA_API_KEY"

      - name: Install lab
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: pytest -q

      - name: Live non-ARC adapter/cache verification
        run: |
          rm -rf /tmp/nvidia-adapter-smoke-cache
          python -m arc_lab.nvidia_smoke \
            --cache-dir /tmp/nvidia-adapter-smoke-cache \
            --report lab/recon/nvidia-adapter-smoke-latest.json

      - name: Persist sanitized verification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/recon/nvidia-adapter-smoke-latest.json
          git commit -m "Record NVIDIA adapter smoke evidence"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-adapter-smoke
          path: lab/recon/nvidia-adapter-smoke-latest.json
          if-no-files-found: error
