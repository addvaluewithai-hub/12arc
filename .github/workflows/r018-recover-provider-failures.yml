name: r018-recover-provider-failures
on:
  push:
    paths: ['lab/triggers/r018-recover-provider-failures.request']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Fetch pinned public training only
        run: |
          git init /tmp/arc-agi-2
          git -C /tmp/arc-agi-2 remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/arc-agi-2 sparse-checkout init --cone
          git -C /tmp/arc-agi-2 sparse-checkout set data/training
          git -C /tmp/arc-agi-2 fetch --depth=1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/arc-agi-2 checkout FETCH_HEAD
          test ! -e /tmp/arc-agi-2/data/evaluation
      - name: Re-run only transient 529 task cases under frozen ARC-R018 protocol
        run: |
          test -n "$NVIDIA_API_KEY"
          python -m arc_lab.compact_hypothesis_search /tmp/arc-agi-2/data/training \
            --baseline lab/results/ARC-R016-baseline.json \
            --cache-dir /tmp/arc-r018-recovery-cache \
            --output /tmp/ARC-R018-recovery.json \
            --task-id 00dbd492 --task-id 05f2a901
      - name: Merge recovered cases and recompute matched verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          initial_path = Path('lab/results/ARC-R018-compact-hypothesis-search.json')
          initial = json.loads(initial_path.read_text())
          recovery = json.loads(Path('/tmp/ARC-R018-recovery.json').read_text())
          failed_ids = {'00dbd492', '05f2a901'}
          recovered = {r['task_id']: r for r in recovery['records']}
          if set(recovered) != failed_ids:
              raise SystemExit('recovery did not return exactly the two frozen transient-failure task IDs')
          untouched = [r for r in initial['records'] if r['task_id'] not in failed_ids]
          records = untouched + [recovered[tid] for tid in initial['protocol']['task_ids'] if tid in failed_ids]
          order = {tid: i for i, tid in enumerate(initial['protocol']['task_ids'])}
          records.sort(key=lambda r: order[r['task_id']])
          unresolved = recovery['provider_failures']
          baseline_solved = sum(bool(r['baseline_solved']) for r in records)
          treatment_solved = sum(bool(r['treatment_solved']) for r in records)
          new_solves = sum(bool(r['new_solve']) for r in records)
          regressions = sum(bool(r['regression']) for r in records)
          verdict = 'PROMOTE' if treatment_solved > baseline_solved and new_solves >= 1 else ('INCONCLUSIVE' if unresolved else 'REJECT')
          final = dict(initial)
          final.update({
              'records': records,
              'baseline_solved': baseline_solved,
              'treatment_solved': treatment_solved,
              'baseline_accuracy': baseline_solved / len(records),
              'treatment_accuracy': treatment_solved / len(records),
              'new_solves': new_solves,
              'regressions': regressions,
              'provider_failures': unresolved,
              'transient_provider_failures_recovered': initial['provider_failures'] - unresolved,
              'calls': initial['calls'] + recovery['calls'],
              'cache_hits': initial['cache_hits'] + recovery['cache_hits'],
              'input_tokens': initial['input_tokens'] + recovery['input_tokens'],
              'output_tokens': initial['output_tokens'] + recovery['output_tokens'],
              'total_tokens': initial['total_tokens'] + recovery['total_tokens'],
              'runtime_seconds': initial['runtime_seconds'] + recovery['runtime_seconds'],
              'candidate_parse_failures': sum(1 for r in records for t in r['tests'] if t.get('candidate_stage') and not t['candidate_stage'].get('parsed')),
              'selector_parse_failures': sum(1 for r in records for t in r['tests'] if t.get('selector_stage') and not t['selector_stage'].get('parsed')),
              'verdict': verdict,
              'recovery': {
                  'reason': 'targeted rerun of only two NVIDIA HTTP 529 transient provider failures',
                  'task_ids': sorted(failed_ids),
                  'protocol_changed': False,
                  'public_evaluation_used': False,
                  'recovery_calls': recovery['calls'],
                  'recovery_tokens': recovery['total_tokens'],
                  'recovery_runtime_seconds': recovery['runtime_seconds'],
              },
          })
          Path('/tmp/ARC-R018-final.json').write_text(json.dumps(final, indent=2, sort_keys=True) + '\n')
          Path('/tmp/ARC-R018-initial.json').write_text(json.dumps(initial, indent=2, sort_keys=True) + '\n')
          print(json.dumps({k: final[k] for k in ['baseline_solved','treatment_solved','new_solves','regressions','provider_failures','calls','total_tokens','runtime_seconds','verdict']}, sort_keys=True))
          PY
      - name: Persist initial and recovered durable evidence
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"
          cp /tmp/ARC-R018-initial.json lab/results/ARC-R018-compact-hypothesis-search-initial.json
          cp /tmp/ARC-R018-recovery.json lab/results/ARC-R018-provider-recovery.json
          cp /tmp/ARC-R018-final.json lab/results/ARC-R018-compact-hypothesis-search.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lab/results/ARC-R018-compact-hypothesis-search-initial.json lab/results/ARC-R018-provider-recovery.json lab/results/ARC-R018-compact-hypothesis-search.json
          git commit -m 'ARC-R018: resolve transient NVIDIA provider failures'
          git push origin HEAD:"$GITHUB_REF_NAME"
