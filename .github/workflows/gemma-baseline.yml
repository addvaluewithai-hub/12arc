name: gemma-baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'lab/triggers/gemma-baseline.request'

permissions:
  contents: write
  actions: read

concurrency:
  group: gemma-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARC_TARGET_MIN_LIVE_CALL_INTERVAL_SECONDS: '61'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lab
        run: python -m pip install -e '.[dev,gemma]'
      - name: Unit tests
        run: pytest -q
      - name: Persist execution-start breadcrumb
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B arc-baseline-observe "origin/$GITHUB_REF_NAME"
          mkdir -p lab/recon
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "protocol": "direct-json-v1",
              "model": "gemma-4-26b-a4b-it",
              "split": "dev_validation",
              "task_count": 174,
              "status": "running",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "min_live_call_interval_seconds": float(os.environ["ARC_TARGET_MIN_LIVE_CALL_INTERVAL_SECONDS"]),
          }
          Path("lab/recon/gemma-baseline-latest.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          git add lab/recon/gemma-baseline-latest.json
          git commit -m "Record Gemma baseline execution start" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Fetch pinned public-training corpus only
        run: |
          git init /tmp/arc-agi-2
          git -C /tmp/arc-agi-2 remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/arc-agi-2 sparse-checkout init --cone
          git -C /tmp/arc-agi-2 sparse-checkout set data/training
          git -C /tmp/arc-agi-2 fetch --depth=1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/arc-agi-2 checkout FETCH_HEAD
          test ! -e /tmp/arc-agi-2/data/evaluation
      - name: Restore cumulative request cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/arc-baseline-cache
          key: arc-r004-target-cache-${{ github.run_id }}
          restore-keys: |
            arc-r004-target-cache-
      - name: Seed cache from best pre-resume artifact
        if: steps.cache-restore.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v4
        with:
          name: arc-r004-target-cache
          path: /tmp/arc-baseline-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32612165079
      - name: Run fixed two-attempt baseline on frozen dev_validation
        id: baseline
        continue-on-error: true
        run: |
          test -n "$GEMINI_API_KEY"
          set +e
          timeout --signal=TERM 42m python -m arc_lab.baseline \
            /tmp/arc-agi-2/data/training \
            lab/benchmarks/arc-agi-2-training-ids.txt \
            --split dev_validation \
            --cache-dir /tmp/arc-baseline-cache \
            --output /tmp/arc-r004-baseline.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Save cumulative request cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/arc-baseline-cache
          key: arc-r004-target-cache-${{ github.run_id }}
      - name: Persist baseline outcome from latest remote branch
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BASELINE_EXIT_CODE: ${{ steps.baseline.outputs.exit_code }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B arc-baseline-persist "origin/$GITHUB_REF_NAME"
            mkdir -p lab/recon lab/results
            python - <<'PY'
          import json, os
          from pathlib import Path
          result_path = Path("/tmp/arc-r004-baseline.json")
          cache_dir = Path("/tmp/arc-baseline-cache")
          exit_code = os.environ.get("BASELINE_EXIT_CODE", "")
          if os.environ["BASELINE_OUTCOME"] == "success":
              status = "success"
          elif exit_code == "124":
              status = "partial_timebox"
          else:
              status = "failure"
          payload = {
              "schema_version": 1,
              "protocol": "direct-json-v1",
              "model": "gemma-4-26b-a4b-it",
              "split": "dev_validation",
              "task_count": 174,
              "status": status,
              "baseline_step_outcome": os.environ["BASELINE_OUTCOME"],
              "baseline_exit_code": exit_code,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "result_present": result_path.exists(),
              "cache_file_count": len(list(cache_dir.glob("*.json"))) if cache_dir.exists() else 0,
              "min_live_call_interval_seconds": float(os.environ["ARC_TARGET_MIN_LIVE_CALL_INTERVAL_SECONDS"]),
          }
          Path("lab/recon/gemma-baseline-latest.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            if test "$BASELINE_OUTCOME" = success; then
              cp /tmp/arc-r004-baseline.json lab/results/ARC-R004-baseline.json
              git add lab/results/ARC-R004-baseline.json
            fi
            git add lab/recon/gemma-baseline-latest.json
            git commit -m "Record Gemma baseline execution outcome" || exit 0
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
      - name: Upload request cache audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-r004-target-cache-${{ github.run_id }}
          path: /tmp/arc-baseline-cache
          if-no-files-found: warn
      - name: Require successful baseline
        if: always()
        env:
          OUTCOME: ${{ steps.baseline.outcome }}
        run: test "$OUTCOME" = success

# ARC-R009 quota-pacing treatment: uncached live request starts are separated by at least 61 seconds, and the baseline process is timeboxed at 42 minutes so post-run cache persistence still executes. direct-json-v1 generation/scoring behavior is unchanged.
