        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lab/registry/queue.json lab/registry/run-counter.json lab/STATE.md lab/HANDOFF.md lab/runs/2026-08-26/ARC-R039.md
