name: Close ARC-R039 T0022B

on:
  push:
    paths:
      - 'lab/triggers/t0022b-close.request'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify contract tests again
        run: pytest -q tests/test_multi_candidate.py tests/test_multi_candidate_contract.py
      - name: Close ARC-R039 deterministically
        run: python lab/scripts/close_t0022b_arc_r039.py
      - name: Persist ARC-R039 closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lab/registry/queue.json lab/registry/run-counter.json lab/STATE.md lab/HANDOFF.md lab/runs/2026-08-26/ARC-R039.md
          git commit -m "Close ARC-R039 T0022B schema contract repair"
          git pull --rebase origin main
          git push origin HEAD:main
