          t=next(x for x in q['tasks'] if x['id']=='T0022B-MULTI-CANDIDATE-SCHEMA-CONTRACT-REPAIR')
          n=next(x for x in q['tasks'] if x['id']=='T0022C-MULTI-CANDIDATE-CONTRACT-MATCHED-RERUN')
