name: T0021 overlap semantic closure audit

on:
  push:
    paths:
      - 'lab/triggers/t0021-overlap-semantic-closure.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t0021-overlap-semantic-closure
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate claim and reservation
        env:
          EXPECTED_TASK: T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT
          EXPECTED_RUN: ARC-R036
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          trigger_path = Path('lab/triggers/t0021-overlap-semantic-closure.request')
          queue_path = Path('lab/registry/queue.json')
          counter_path = Path('lab/registry/run-counter.json')
          trigger = json.loads(trigger_path.read_text(encoding='utf-8'))
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          counter = json.loads(counter_path.read_text(encoding='utf-8'))

          expected_task = os.environ['EXPECTED_TASK']
          expected_run = os.environ['EXPECTED_RUN']
          checks = {
              'schema_version': trigger.get('schema_version') == 1,
              'task_id': trigger.get('task_id') == expected_task,
              'run': trigger.get('run') == expected_run,
              'shift_id_present': isinstance(trigger.get('shift_id'), str) and bool(trigger.get('shift_id')),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError(f'trigger validation failed: {failed}; trigger={trigger!r}')

          task_matches = [t for t in queue.get('tasks', []) if t.get('id') == expected_task]
          if len(task_matches) != 1:
              raise RuntimeError(f'expected one queue task {expected_task}, found {len(task_matches)}')
          task = task_matches[0]
          claim = task.get('claim') or {}
          if task.get('status') != 'claimed':
              raise RuntimeError(f"task must remain claimed, found {task.get('status')!r}")
          if claim.get('shift_id') != trigger['shift_id']:
              raise RuntimeError(f"claim/trigger shift mismatch: {claim.get('shift_id')!r} != {trigger['shift_id']!r}")

          reservation_matches = [
              r for r in counter.get('active_reservations', [])
              if r.get('run') == expected_run and r.get('task_id') == expected_task
          ]
          if len(reservation_matches) != 1:
              raise RuntimeError(f'expected one active reservation for {expected_run}/{expected_task}, found {len(reservation_matches)}')
          reservation = reservation_matches[0]
          if reservation.get('shift_id') != trigger['shift_id']:
              raise RuntimeError(f"reservation/trigger shift mismatch: {reservation.get('shift_id')!r} != {trigger['shift_id']!r}")

          print(json.dumps({
              'validated_task': expected_task,
              'validated_run': expected_run,
              'validated_shift_id': trigger['shift_id'],
              'task_status': task.get('status'),
              'last_completed_run': counter.get('last_completed_run'),
              'next_run_number': counter.get('next_run_number'),
          }, sort_keys=True))
          PY
      - name: Install and run diagnostic tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_lattice_region.py tests/test_schema_v2_oracle_audit.py tests/test_variable_span_overlap_audit.py tests/test_overlap_semantic_closure_audit.py
      - name: Fetch pinned public training task only
        run: |
          git init /tmp/arc-agi-2
          git -C /tmp/arc-agi-2 remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/arc-agi-2 sparse-checkout init --cone
          git -C /tmp/arc-agi-2 sparse-checkout set data/training
          git -C /tmp/arc-agi-2 fetch --depth=1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/arc-agi-2 checkout FETCH_HEAD
          test ! -e /tmp/arc-agi-2/data/evaluation
          test -f /tmp/arc-agi-2/data/training/0607ce86.json
      - name: Run frozen-semantics closure diagnostic
        run: |
          python -m arc_lab.overlap_semantic_closure_audit /tmp/arc-agi-2/data/training --output lab/results/ARC-R036-overlap-semantic-closure.json
          cat lab/results/ARC-R036-overlap-semantic-closure.json
      - name: Write durable execution status
        if: success()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
            'schema_version': 1,
            'run': 'ARC-R036',
            'task_id': 'T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT',
            'status': 'complete',
            'workflow': '.github/workflows/t0021-overlap-semantic-closure.yml',
            'workflow_run_id': '${{ github.run_id }}',
            'completed_at': datetime.now(timezone.utc).isoformat(),
            'expected_result': 'lab/results/ARC-R036-overlap-semantic-closure.json',
            'target_model_calls': 0,
            'public_evaluation_used': False,
          }
          Path('lab/executions/ARC-R036.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
      - name: Persist result and status
        if: success()
        run: |
          git config user.name 'arc-research-bot'
          git config user.email 'arc-research-bot@users.noreply.github.com'
          git add lab/results/ARC-R036-overlap-semantic-closure.json lab/executions/ARC-R036.json
          git commit -m 'ARC-R036: persist semantic-closure diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
