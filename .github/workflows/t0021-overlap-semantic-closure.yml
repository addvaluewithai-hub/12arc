name: T0021 overlap semantic closure audit

on:
  push:
    paths:
      - 'lab/triggers/t0021-overlap-semantic-closure.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t0021-overlap-semantic-closure
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate claim and reservation
        run: |
          set -euo pipefail
          TASK='T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT'
          RUN='ARC-R036'
          TRIGGER='lab/triggers/t0021-overlap-semantic-closure.request'
          QUEUE='lab/registry/queue.json'
          COUNTER='lab/registry/run-counter.json'

          python -m json.tool "$TRIGGER" >/dev/null
          python -m json.tool "$QUEUE" >/dev/null
          python -m json.tool "$COUNTER" >/dev/null

          trigger_task=$(jq -r '.task_id' "$TRIGGER")
          trigger_run=$(jq -r '.run' "$TRIGGER")
          trigger_shift=$(jq -r '.shift_id' "$TRIGGER")
          trigger_schema=$(jq -r '.schema_version' "$TRIGGER")
          task_count=$(jq --arg task "$TASK" '[.tasks[] | select(.id == $task)] | length' "$QUEUE")
          task_status=$(jq -r --arg task "$TASK" '.tasks[] | select(.id == $task) | .status' "$QUEUE")
          claim_shift=$(jq -r --arg task "$TASK" '.tasks[] | select(.id == $task) | .claim.shift_id' "$QUEUE")
          reservation_count=$(jq --arg run "$RUN" --arg task "$TASK" '[.active_reservations[] | select(.run == $run and .task_id == $task)] | length' "$COUNTER")
          reservation_shift=$(jq -r --arg run "$RUN" --arg task "$TASK" '.active_reservations[] | select(.run == $run and .task_id == $task) | .shift_id' "$COUNTER")

          printf 'trigger_schema=%s\ntrigger_task=%s\ntrigger_run=%s\ntrigger_shift=%s\ntask_count=%s\ntask_status=%s\nclaim_shift=%s\nreservation_count=%s\nreservation_shift=%s\n' \
            "$trigger_schema" "$trigger_task" "$trigger_run" "$trigger_shift" "$task_count" "$task_status" "$claim_shift" "$reservation_count" "$reservation_shift"

          test "$trigger_schema" = '1'
          test "$trigger_task" = "$TASK"
          test "$trigger_run" = "$RUN"
          test -n "$trigger_shift"
          test "$task_count" = '1'
          test "$task_status" = 'claimed'
          test "$claim_shift" = "$trigger_shift"
          test "$reservation_count" = '1'
          test "$reservation_shift" = "$trigger_shift"
      - name: Install and run diagnostic tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_lattice_region.py tests/test_schema_v2_oracle_audit.py tests/test_variable_span_overlap_audit.py tests/test_overlap_semantic_closure_audit.py
      - name: Fetch pinned public training task only
        run: |
          git init /tmp/arc-agi-2
          git -C /tmp/arc-agi-2 remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/arc-agi-2 sparse-checkout init --cone
          git -C /tmp/arc-agi-2 sparse-checkout set data/training
          git -C /tmp/arc-agi-2 fetch --depth=1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/arc-agi-2 checkout FETCH_HEAD
          test ! -e /tmp/arc-agi-2/data/evaluation
          test -f /tmp/arc-agi-2/data/training/0607ce86.json
      - name: Run frozen-semantics closure diagnostic
        run: |
          python -m arc_lab.overlap_semantic_closure_audit /tmp/arc-agi-2/data/training --output lab/results/ARC-R036-overlap-semantic-closure.json
          cat lab/results/ARC-R036-overlap-semantic-closure.json
      - name: Write durable execution status
        if: success()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
            'schema_version': 1,
            'run': 'ARC-R036',
            'task_id': 'T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT',
            'status': 'complete',
            'workflow': '.github/workflows/t0021-overlap-semantic-closure.yml',
            'workflow_run_id': '${{ github.run_id }}',
            'completed_at': datetime.now(timezone.utc).isoformat(),
            'expected_result': 'lab/results/ARC-R036-overlap-semantic-closure.json',
            'target_model_calls': 0,
            'public_evaluation_used': False,
          }
          Path('lab/executions/ARC-R036.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
      - name: Persist result and status
        if: success()
        run: |
          git config user.name 'arc-research-bot'
          git config user.email 'arc-research-bot@users.noreply.github.com'
          git add lab/results/ARC-R036-overlap-semantic-closure.json lab/executions/ARC-R036.json
          git commit -m 'ARC-R036: persist semantic-closure diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
