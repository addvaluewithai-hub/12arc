name: T0021 overlap semantic closure audit

on:
  push:
    paths:
      - 'lab/triggers/t0021-overlap-semantic-closure.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t0021-overlap-semantic-closure
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair queue registry if malformed
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          queue_path = Path('lab/registry/queue.json')
          task_id = 'T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT'
          expected_claim = {
              'shift_id': 'ARC-SHIFT-20260825T131227Z',
              'claimed_at': '2026-08-25T13:12:27Z',
              'lease_expires_at': '2026-08-25T15:12:27Z',
          }

          try:
              queue = json.loads(queue_path.read_text())
              repaired = False
          except json.JSONDecodeError as exc:
              print(f'queue registry malformed: {exc}')
              raw = subprocess.check_output([
                  'git', 'show',
                  'd82dfc4ab3c730cf57711854bd168a4c301bcc88:lab/registry/queue.json'
              ], text=True)
              queue = json.loads(raw)
              repaired = True

          tasks = [t for t in queue.get('tasks', []) if t.get('id') == task_id]
          if len(tasks) != 1:
              raise SystemExit(f'queue repair: expected exactly one {task_id}, found {len(tasks)}')
          task = tasks[0]
          if task.get('status') != 'claimed' or task.get('claim') != expected_claim:
              task['status'] = 'claimed'
              task['claim'] = expected_claim
              repaired = True

          rendered = json.dumps(queue, separators=(',', ':')) + '\n'
          json.loads(rendered)
          queue_path.write_text(rendered)
          print(json.dumps({'queue_repaired': repaired, 'task_status': task['status'], 'claim': task['claim']}, sort_keys=True))
          PY
      - name: Validate claim and reservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          task_id = 'T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT'
          run_id = 'ARC-R036'
          trigger = json.loads(Path('lab/triggers/t0021-overlap-semantic-closure.request').read_text())
          queue = json.loads(Path('lab/registry/queue.json').read_text())
          counter = json.loads(Path('lab/registry/run-counter.json').read_text())

          tasks = [t for t in queue['tasks'] if t.get('id') == task_id]
          if len(tasks) != 1:
              raise SystemExit(f'claim validation: expected exactly one {task_id}, found {len(tasks)}')
          task = tasks[0]
          claim = task.get('claim') or {}
          shift_id = trigger.get('shift_id')
          reservations = [r for r in counter.get('active_reservations', [])
                          if r.get('run') == run_id and r.get('task_id') == task_id and r.get('shift_id') == shift_id]

          observed = {
              'trigger_schema_version': trigger.get('schema_version'),
              'trigger_task': trigger.get('task_id'),
              'trigger_run': trigger.get('run'),
              'trigger_shift': shift_id,
              'task_status': task.get('status'),
              'claim_shift': claim.get('shift_id'),
              'matching_reservations': len(reservations),
          }
          print(json.dumps(observed, sort_keys=True))
          checks = {
              'trigger schema_version': trigger.get('schema_version') == 1,
              'trigger task': trigger.get('task_id') == task_id,
              'trigger run': trigger.get('run') == run_id,
              'task claimed': task.get('status') == 'claimed',
              'claim/trigger shift': claim.get('shift_id') == shift_id,
              'exact reservation': len(reservations) == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('claim validation failed: ' + ', '.join(failed))
          PY
      - name: Persist registry repair
        run: |
          if git diff --quiet -- lab/registry/queue.json; then
            echo 'queue registry already valid; no repair commit needed'
          else
            git config user.name 'arc-research-bot'
            git config user.email 'arc-research-bot@users.noreply.github.com'
            git add lab/registry/queue.json
            git commit -m 'ARC-R036: repair queue registry while preserving T0021 claim'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Install and run diagnostic tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_lattice_region.py tests/test_schema_v2_oracle_audit.py tests/test_variable_span_overlap_audit.py tests/test_overlap_semantic_closure_audit.py
      - name: Fetch pinned public training task only
        run: |
          git init /tmp/arc-agi-2
          git -C /tmp/arc-agi-2 remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/arc-agi-2 sparse-checkout init --cone
          git -C /tmp/arc-agi-2 sparse-checkout set data/training
          git -C /tmp/arc-agi-2 fetch --depth=1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/arc-agi-2 checkout FETCH_HEAD
          test ! -e /tmp/arc-agi-2/data/evaluation
          test -f /tmp/arc-agi-2/data/training/0607ce86.json
      - name: Run frozen-semantics closure diagnostic
        run: |
          python -m arc_lab.overlap_semantic_closure_audit /tmp/arc-agi-2/data/training --output lab/results/ARC-R036-overlap-semantic-closure.json
          cat lab/results/ARC-R036-overlap-semantic-closure.json
      - name: Write durable execution status
        if: success()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
            'schema_version': 1,
            'run': 'ARC-R036',
            'task_id': 'T0021-OVERLAP-SEMANTIC-CLOSURE-AUDIT',
            'status': 'complete',
            'workflow': '.github/workflows/t0021-overlap-semantic-closure.yml',
            'workflow_run_id': '${{ github.run_id }}',
            'completed_at': datetime.now(timezone.utc).isoformat(),
            'expected_result': 'lab/results/ARC-R036-overlap-semantic-closure.json',
            'target_model_calls': 0,
            'public_evaluation_used': False,
          }
          Path('lab/executions/ARC-R036.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
      - name: Persist result and status
        if: success()
        run: |
          git config user.name 'arc-research-bot'
          git config user.email 'arc-research-bot@users.noreply.github.com'
          git add lab/results/ARC-R036-overlap-semantic-closure.json lab/executions/ARC-R036.json
          git commit -m 'ARC-R036: persist semantic-closure diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
