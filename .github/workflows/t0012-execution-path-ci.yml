name: t0012-execution-path-ci

on:
  push:
    paths:
      - 'lab/validation/t0012a.request'

permissions:
  contents: write

concurrency:
  group: t0012-execution-path-ci
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run execution-path tests
        run: pytest -q tests/test_target_model.py tests/test_nvidia_baseline.py tests/test_max_reasoning_direct.py
      - name: Verify target workflow contract without model calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/t0012-max-reasoning-direct.yml')
          text = p.read_text()
          required = [
              "lab/triggers/t0012-max-reasoning.request",
              "timeout-minutes: 360",
              "NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}",
              "--provider-timeout-seconds 900",
              "--max-transport-retries 2",
              "max-parallel: 6",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing workflow contract fragments: {missing}')
          PY
      - name: Persist validation marker
        env:
          VALIDATED_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          req = json.loads(Path('lab/validation/t0012a.request').read_text())
          payload = {
              'schema_version': 1,
              'task_id': 'T0012A-MAX-REASONING-EXECUTION-PATH',
              'status': 'passed',
              'validated_commit': os.environ['VALIDATED_SHA'],
              'workflow_run_id': os.environ['VALIDATION_RUN_ID'],
              'validated_at': datetime.now(timezone.utc).isoformat(),
              'request_nonce': req.get('nonce'),
              'tests': [
                  'tests/test_target_model.py',
                  'tests/test_nvidia_baseline.py',
                  'tests/test_max_reasoning_direct.py',
              ],
              'target_model_calls': 0,
          }
          Path('lab/validation/t0012a-passed.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lab/validation/t0012a-passed.json
          git commit -m "ARC-R025: persist T0012A execution-path validation"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
