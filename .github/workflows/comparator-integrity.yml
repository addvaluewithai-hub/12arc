name: comparator-integrity

on:
  push:
    paths:
      - 'src/arc_lab/comparator_integrity.py'
      - 'tests/test_comparator_integrity.py'
      - '.github/workflows/comparator-integrity.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_comparator_integrity.py
