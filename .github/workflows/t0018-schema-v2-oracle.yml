name: t0018-schema-v2-oracle

on:
  push:
    paths:
      - 'lab/triggers/t0018-schema-v2-oracle.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate trigger, durable claim and reservation
        run: |
          python - <<'PY'
          import json
          trigger=json.load(open('lab/triggers/t0018-schema-v2-oracle.request'))
          q=json.load(open('lab/registry/queue.json'))
          c=json.load(open('lab/registry/run-counter.json'))
          assert trigger['schema_version']==1
          assert trigger['task_id']=='T0018-SCHEMA-V2-EXPRESSIBILITY-ORACLE-AUDIT'
          assert trigger['run']=='ARC-R033'
          t=next(t for t in q['tasks'] if t['id']==trigger['task_id'])
          assert t['status']=='claimed'
          assert t['claim']['run']==trigger['run']
          assert t['claim']['shift_id']==trigger['shift_id']
          assert any(r['run']==trigger['run'] and r['task_id']==t['id'] for r in c['active_reservations'])
          PY
      - name: Unit tests
        run: pytest -q tests/test_schema_v2_oracle_audit.py tests/test_lattice_region.py
      - name: Fetch pinned public training data only
        run: |
          git init /tmp/arc-agi-2
          git -C /tmp/arc-agi-2 remote add origin https://github.com/arcprize/ARC-AGI-2.git
          git -C /tmp/arc-agi-2 sparse-checkout init --cone
          git -C /tmp/arc-agi-2 sparse-checkout set data/training
          git -C /tmp/arc-agi-2 fetch --depth=1 origin f3283f727488ad98fe575ea6a5ac981e4a188e49
          git -C /tmp/arc-agi-2 checkout FETCH_HEAD
          test ! -e /tmp/arc-agi-2/data/evaluation
      - name: Run bounded exhaustive audit
        run: |
          mkdir -p lab/results
          python -m arc_lab.schema_v2_oracle_audit /tmp/arc-agi-2/data/training --output lab/results/ARC-R033-schema-v2-expressibility.json
      - name: Persist audit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lab/results/ARC-R033-schema-v2-expressibility.json
          git commit -m 'ARC-R033: persist schema-v2 expressibility audit'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
